[project]
name = "creator-office"
version = "0.1.0"
description = "Creator Office AI: a CrewAI-coordinated studio to plan, produce, publish and analyse video content."
requires-python = ">=3.11, <3.14"
license = "MIT"
dependencies = [
    # Agent orchestration. Installed from this repository (see README): the
    # app runs against the CrewAI sources that live next to it.
    "crewai",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28",
    "cryptography>=42.0",
    "pillow>=12.3.0",
    "defusedxml>=0.7.1",
    # IANA time zones where the system has no database of its own (Windows).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Bundles a static FFmpeg binary. Not needed when FFmpeg is already on PATH
# or FFMPEG_PATH points at one.
media = ["imageio-ffmpeg>=0.6"]
dev = ["pytest>=8", "ruff==0.15.1"]

[project.scripts]
creator-office = "creator_office.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_office"]

[tool.uv.sources]
crewai = { path = "../../../lib/crewai", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--tb=short -q"
filterwarnings = [
    # Deprecations raised inside CrewAI by its own internals, not by this app.
    "ignore::DeprecationWarning:crewai.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E", "F", "B", "S", "RUF", "N", "W", "I", "T", "PIE", "TID", "ASYNC", "RET", "UP"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # long lines; Spanish UI copy uses accents and typographic quotes

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
